<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CHECKLIST COMODATOS BACIO</title>
<style>
:root{--bg:#f4f4f5;--card:#fff;--tx:#18181b;--mut:#71717a;--bd:#d4d4d8;--ac:#d62828;--ok:#16a34a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111113;--card:#1c1c1f;--tx:#f4f4f5;--mut:#a1a1aa;--bd:#3f3f46}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.w{max-width:640px;margin:0 auto;padding:16px}
header{text-align:center;padding:8px 0 4px}header img{height:56px;max-width:60%;background:#fff;border-radius:8px;padding:4px 8px}
h1{margin:12px 0 4px;font-size:22px;letter-spacing:.5px}
.sub{color:var(--mut);font-size:13px}
.bar{height:8px;background:var(--bd);border-radius:9px;margin:14px 0;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .2s}
.it{display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:10px;cursor:pointer;user-select:none}
.it.on{border-color:var(--ok)}
.it input[type=checkbox]{width:28px;height:28px;accent-color:var(--ok);flex:none}
.it b{display:block;font-size:16px}.it small{color:var(--mut);font-size:13px}
.rg{margin-top:8px;display:flex;gap:6px;align-items:center;font-size:14px}
input[type=text],input[type=date],textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px;width:100%}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
@media(max-width:480px){.grid{grid-template-columns:1fr}}
.box{background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden}
.box h2{margin:0;background:#18181b;color:#fff;font-size:15px;text-align:center;padding:10px;letter-spacing:1px}
.box div{padding:12px}.box label{display:block;font-size:13px;color:var(--mut);margin:0 0 4px}.box div>*+label{margin-top:10px}
.btns{display:flex;gap:10px;margin-top:16px}
button{flex:1;font:inherit;font-weight:600;padding:14px;border-radius:12px;border:0;cursor:pointer}
.p{background:var(--ac);color:#fff}.s{background:var(--bd);color:var(--tx)}
.tg{display:flex;gap:6px;flex:none}.tg button{flex:none;padding:10px 12px;font-size:13px;background:var(--bd);color:var(--tx)}.tg button.ok.a{background:var(--ok);color:#fff}.tg button.no.a{background:var(--ac);color:#fff}.it.nok{border-color:var(--ac)}.it{cursor:default}
@media(max-width:480px){.it{flex-wrap:wrap}.tg{width:100%}.tg button{flex:1}}
canvas{width:100%;height:160px;background:#fff;border:1px dashed var(--bd);border-radius:8px;touch-action:none;display:block}
textarea{resize:vertical}
@media print{body{background:#fff;color:#000}.btns,.bar,#sigclr{display:none}.it,.box{break-inside:avoid}}
</style></head><body><div class="w">

<div class="bar"><i id="pb"></i></div><div class="sub" id="pt" style="text-align:center;margin-top:-6px;margin-bottom:12px"></div>
<div id="list"></div>
<div class="grid">
<div class="box"><h2>EXPEDIÇÃO</h2><div><label>Conferido em</label><input type="date" id="exp_d"><label>Responsável</label><input type="text" id="exp_r"></div></div>
<div class="box"><h2>CLIENTE</h2><div><label>Recebido em</label><input type="date" id="cli_d"><label>Nome</label><input type="text" id="cli_n"></div></div>
</div>
<div class="box" style="margin-top:10px"><h2>OBSERVAÇÃO</h2><div><textarea id="obs" rows="3" placeholder="Avarias, detalhes da entrega..."></textarea></div></div>
<div class="box" style="margin-top:10px"><h2>ASSINATURA DO CLIENTE NA ENTREGA</h2><div><canvas id="sig"></canvas><button class="s" id="sigclr" style="margin-top:8px;width:100%;padding:10px">Limpar assinatura</button></div></div>
<div class="btns"><button class="s" id="clr">Limpar</button><button class="p" onclick="window.print()">Imprimir / PDF</button></div>
</div>
<script>
const items=[
["RG legível e correto","rg"],
["Limpa e Higienizada",""],
["Grades ou cestos completos","5 Grades VF50, 4 Grades VF28, 3 Cestos NF20/HCEB"],
["Cabo elétrico íntegro",""],
["LED funcionando",""],
["Testada","Ligada 24hrs e chegando à temperatura mínima de -18°C"],
["Sem danos aparentes","marcas excessivas ou quebrado"],
["P/ Envio, Nota Fiscal e Comodato","mesmo RG da conservadora"]];
let S={c:[],t:{}};
try{S=JSON.parse(localStorage.getItem("ckb"))||S}catch(e){}
function save(){try{localStorage.setItem("ckb",JSON.stringify(S))}catch(e){}}
const L=document.getElementById("list");
items.forEach((it,i)=>{
const d=document.createElement("div");d.className="it";
d.innerHTML=`<div style="flex:1"><b>${it[0]}</b>${it[1]==="rg"?`<div class="rg">RG Nº: <input type="text" data-k="rg" style="max-width:220px"></div>`:it[1]?`<small>${it[1]}</small>`:""}</div><div class="tg"><button class="ok">OK</button><button class="no">NÃO OK</button></div>`;
const bo=d.querySelector(".ok"),bn=d.querySelector(".no");
function r(){const v=S.c[i]===true?"ok":S.c[i];bo.classList.toggle("a",v==="ok");bn.classList.toggle("a",v==="nok");d.classList.toggle("on",v==="ok");d.classList.toggle("nok",v==="nok")}
bo.onclick=()=>{S.c[i]=(S.c[i]==="ok"||S.c[i]===true)?null:"ok";save();r();prog()};
bn.onclick=()=>{S.c[i]=S.c[i]==="nok"?null:"nok";save();r();prog()};
r();L.appendChild(d)});
document.querySelectorAll('input[type=text],input[type=date],textarea').forEach(el=>{const k=el.id||el.dataset.k;el.value=S.t[k]||"";el.oninput=()=>{S.t[k]=el.value;save()}});
function prog(){const n=items.filter((_,i)=>S.c[i]).length,x=items.filter((_,i)=>S.c[i]==="nok").length;pb.style.width=n/items.length*100+"%";pt.textContent=n+" de "+items.length+" itens conferidos"+(x?" · "+x+" NÃO OK":"")+(n===items.length&&!x?" ✓":"")}
const cv=document.getElementById("sig"),cx=cv.getContext("2d");
function fit(){const r=cv.getBoundingClientRect(),k=window.devicePixelRatio||1;cv.width=r.width*k;cv.height=r.height*k;cx.scale(k,k);cx.lineWidth=2.2;cx.lineCap="round";cx.strokeStyle="#000";if(S.sig){const im=new Image();im.onload=()=>cx.drawImage(im,0,0,r.width,r.height);im.src=S.sig}}
fit();let dr=false;
function xy(e){const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]}
cv.onpointerdown=e=>{dr=true;cv.setPointerCapture(e.pointerId);const[x,y]=xy(e);cx.beginPath();cx.moveTo(x,y);cx.lineTo(x+.1,y);cx.stroke()};
cv.onpointermove=e=>{if(!dr)return;const[x,y]=xy(e);cx.lineTo(x,y);cx.stroke()};
cv.onpointerup=()=>{if(!dr)return;dr=false;try{S.sig=cv.toDataURL()}catch(e){}save()};
sigclr.onclick=()=>{cx.clearRect(0,0,cv.width,cv.height);S.sig=null;save()};
clr.onclick=()=>{if(!confirm("Limpar todo o checklist?"))return;S={c:[],t:{}};save();location.reload()};
prog();
</script></body></html>
